  }
  .btn .small { font-size: 14px; opacity: .8; }
  .btn .big { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .btn.mine { outline: 4px solid #6495FF; outline-offset: 3px; }
  .hint { font-size: 15px; color: #2b5fd9; font-weight: 600; min-height: 22px; margin-bottom: 12px; }
  .guide {
    margin-top: 26px; background: #f3f6ff; border-radius: 12px; padding: 18px;
    text-align: left; font-size: 16px; line-height: 1.6;
  }
  .guide b { color: #2b5fd9; }
